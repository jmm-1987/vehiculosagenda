<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Presupuesto</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2px 30px;
            background: linear-gradient(to right, #ffffff, #343a40);
            color: white;
            height: 50px;
            box-sizing: border-box;
        }
        .top-bar img {
            width: 200px;
            height: 45px;
            object-fit: contain;
        }
        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
        }
        .form-container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 3px solid #6f42c1;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
        }
        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 15px;
        }
        .form-row-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        @media screen and (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            .form-row-2 {
                grid-template-columns: 1fr;
            }
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin: 5px;
            font-size: 14px;
            transition: all 0.3s;
        }
        .btn-success {
            background-color: #28a745;
            color: white;
        }
        .btn-success:hover {
            background-color: #218838;
        }
        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }
        .btn-secondary:hover {
            background-color: #5a6268;
        }
        .btn-group {
            margin-top: 25px;
            text-align: right;
        }
        input[readonly] {
            background-color: #e9ecef;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo de la empresa">
    </div>
    <div class="container">
        <div class="form-container">
            <h1>Editar Presupuesto #{{ presupuesto_editar.numero_presupuesto }}</h1>
            
            <form action="/modificar_presupuesto" method="POST">
                <input type="hidden" name="id" value="{{ presupuesto_editar.id }}">
                
                <div class="form-row-2">
                    <div class="form-group">
                        <label for="numero_presupuesto">Número de Presupuesto</label>
                        <input type="text" id="numero_presupuesto" name="numero_presupuesto" 
                               value="{{ presupuesto_editar.numero_presupuesto }}" readonly>
                    </div>
                    <div class="form-group">
                        <label for="fecha_presupuesto">Fecha del Presupuesto (*)</label>
                        <input type="date" id="fecha_presupuesto" name="fecha_presupuesto" 
                               value="{{ presupuesto_editar.fecha_presupuesto.strftime('%Y-%m-%d') }}" required>
                    </div>
                </div>

                <div class="form-row-2">
                    <div class="form-group">
                        <label for="usuario_creacion">Creado por</label>
                        <input type="text" id="usuario_creacion" name="usuario_creacion"
                               value="{{ presupuesto_editar.usuario_creacion or 'No registrado' }}" readonly>
                    </div>
                    <div class="form-group">
                        <label for="fecha_creacion">Fecha de creación</label>
                        <input type="text" id="fecha_creacion" name="fecha_creacion"
                               value="{% if presupuesto_editar.fecha_creacion %}{{ presupuesto_editar.fecha_creacion.strftime('%d/%m/%Y %H:%M') }}{% else %}No registrada{% endif %}" readonly>
                    </div>
                </div>

                <div class="form-group">
                    <label for="cliente_id">Cliente (*)</label>
                    <select id="cliente_id" name="cliente_id" required>
                        <option value="">Seleccione un cliente</option>
                        {% if lista_clientes %}
                            {% for cliente in lista_clientes %}
                                <option value="{{ cliente.id }}" 
                                    {% if presupuesto_editar.cliente_id == cliente.id %}selected{% endif %}>
                                    {{ cliente.nombre }} - {{ cliente.cif }}
                                </option>
                            {% endfor %}
                        {% endif %}
                    </select>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="bultos">Bultos (*)</label>
                        <input type="text" id="bultos" name="bultos" value="{{ presupuesto_editar.bultos or '' }}" required>
                    </div>
                    <div class="form-group">
                        <label for="kg">Kg (*)</label>
                        <input type="text" id="kg" name="kg" value="{{ presupuesto_editar.kg or '' }}" required>
                    </div>
                    <div class="form-group">
                        <label for="medidas">Medidas (*)</label>
                        <input type="text" id="medidas" name="medidas" value="{{ presupuesto_editar.medidas or '' }}" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="importe">Importe (€)</label>
                        <input type="number" id="importe" name="importe" step="0.01" min="0" 
                               value="{{ presupuesto_editar.importe }}" onchange="calcularTotal()">
                    </div>
                    <div class="form-group">
                        <label for="iva_percent">Tipo de IVA (%)</label>
                        <input type="number" id="iva_percent" name="iva_percent" step="0.01" min="0" max="100" 
                               value="{{ '%.2f'|format(iva_percent) }}" onchange="calcularTotal()">
                    </div>
                    <div class="form-group">
                        <label for="iva_cantidad">Cantidad IVA (€)</label>
                        <input type="number" id="iva_cantidad" name="iva" step="0.01" min="0" 
                               value="{{ presupuesto_editar.iva }}" readonly>
                    </div>
                    <div class="form-group">
                        <label for="total">Total (€)</label>
                        <input type="number" id="total" name="total" step="0.01" min="0" 
                               value="{{ presupuesto_editar.total }}" readonly>
                    </div>
                </div>

                <div class="form-group">
                    <label for="estado">Estado</label>
                    <select id="estado" name="estado">
                        <option value="PENDIENTE" {% if presupuesto_editar.estado == 'PENDIENTE' %}selected{% endif %}>Pendiente</option>
                        <option value="APROBADO" {% if presupuesto_editar.estado == 'APROBADO' %}selected{% endif %}>Aprobado</option>
                        <option value="RECHAZADO" {% if presupuesto_editar.estado == 'RECHAZADO' %}selected{% endif %}>Rechazado</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="observaciones">Observaciones</label>
                    <textarea id="observaciones" name="observaciones" rows="2" placeholder="Introduce aquí origen y destino de la mercancía">{{ presupuesto_editar.observaciones or '' }}</textarea>
                </div>

                <div class="btn-group">
                    <a href="{{ url_for('lista_presupuestos') }}" class="btn btn-secondary">
                        <i class="fas fa-times"></i> Cancelar
                    </a>
                    <button type="submit" class="btn btn-success">
                        <i class="fas fa-save"></i> Guardar Cambios
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function calcularTotal() {
            const importe = parseFloat(document.getElementById('importe').value) || 0;
            const ivaPercent = parseFloat(document.getElementById('iva_percent').value) || 0;
            
            const ivaCantidad = (importe * ivaPercent) / 100;
            const total = importe + ivaCantidad;
            
            document.getElementById('iva_cantidad').value = ivaCantidad.toFixed(2);
            document.getElementById('total').value = total.toFixed(2);
        }
        
        // Calcular total al cargar la página
        window.addEventListener('DOMContentLoaded', function() {
            calcularTotal();
        });
    </script>
</body>
</html>
