<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Pago - Caja</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2px 30px;
            background: linear-gradient(to right, #ffffff, #343a40);
            color: white;
            height: 50px;
            box-sizing: border-box;
        }
        .top-bar img {
            width: 200px;
            height: 45px;
            object-fit: contain;
        }
        .top-user {
            font-weight: bold;
            font-size: 14px;
            margin-left: auto;
            margin-right: 20px;
        }
        .top-button {
            padding: 2px 8px;
            background-color: #c51500;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
        }
        .form-container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 6px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .form-group textarea {
            min-height: 50px;
            resize: vertical;
        }
        .input-cantidad {
            background-color: #fff9e6;
            border-color: #ffc107;
            padding: 4px 6px;
            font-size: 13px;
            width: 90%;
            text-align: right;
        }
        .input-cantidad:focus {
            background-color: #fffce8;
            border-color: #ff9800;
            outline: none;
        }
        .form-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .form-row-2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .form-checkbox {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .form-checkbox input[type="checkbox"] {
            width: auto;
        }
        .btn {
            padding: 12px 24px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            text-decoration: none;
            display: inline-block;
            margin-right: 10px;
        }
        .btn:hover {
            background: #218838;
        }
        .btn-secondary {
            background: #6c757d;
        }
        .btn-secondary:hover {
            background: #5a6268;
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <a href="/portada"><img src="{{ url_for('static', filename='logo.png') }}" alt="Logo"></a>
        <span class="top-user">{{ current_user.username }}</span>
        <a href="/logout" class="top-button">Cerrar sesión</a>
    </div>

    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h1 style="margin: 0; font-size: 24px;"><i class="fas fa-edit"></i> Editar Pago</h1>
            <div>
                {% if tipo_caja == 'CAJA' %}
                    <a href="{{ url_for('caja_index') }}" class="btn" style="background: #6c757d;">
                        <i class="fas fa-arrow-left"></i> Volver a Caja
                    </a>
                {% else %}
                    <a href="{{ url_for('caja_reembolsos_index') }}" class="btn" style="background: #6c757d;">
                        <i class="fas fa-arrow-left"></i> Volver a Caja Reembolsos
                    </a>
                {% endif %}
            </div>
        </div>
        
        <div class="form-container">
            <form method="POST" action="{% if tipo_caja == 'CAJA' %}{{ url_for('editar_pago', id=pago.id) }}{% else %}{{ url_for('editar_pago_reembolsos', id=pago.id) }}{% endif %}">
                <div class="form-row">
                    <div class="form-group">
                        <label for="fecha_albaran">Fecha Albarán *</label>
                        <input type="date" id="fecha_albaran" name="fecha_albaran" 
                               value="{{ pago.fecha_albaran.strftime('%Y-%m-%d') }}" required>
                    </div>
                    <div class="form-group">
                        <label for="albaran">Albarán</label>
                        <input type="text" id="albaran" name="albaran" value="{{ pago.albaran }}">
                    </div>
                    <div class="form-group">
                        <label for="observaciones">Observaciones</label>
                        <input type="text" id="observaciones" name="observaciones" value="{{ pago.observaciones }}">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="base">Base (€)</label>
                        <input type="number" id="base" name="base" step="0.01" value="{{ "%.2f"|format(pago.base) }}" class="input-cantidad" oninput="calcularTotalPago()">
                    </div>
                    <div class="form-group">
                        <label for="iva">IVA (€)</label>
                        <input type="number" id="iva" name="iva" step="0.01" value="{{ "%.2f"|format(pago.iva) }}" class="input-cantidad" oninput="calcularTotalPago()">
                    </div>
                    <div class="form-group">
                        <div class="form-checkbox" style="margin-top: 24px;">
                            <input type="checkbox" id="es_factura" name="es_factura" {% if pago.es_factura %}checked{% endif %}>
                            <label for="es_factura" style="margin: 0;">Es Factura</label>
                        </div>
                    </div>
                </div>
                
                <div style="margin-top: 20px; padding: 15px; background-color: #ffe8e8; border-radius: 4px; border: 2px solid #dc3545;">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <span style="font-size: 18px; font-weight: bold; color: #333;">Total Movimiento:</span>
                        <span id="total_pago" style="font-size: 24px; font-weight: bold; color: #dc3545;">0.00€</span>
                    </div>
                </div>

                <div style="margin-top: 15px; text-align: right;">
                    <button type="submit" class="btn">
                        <i class="fas fa-save"></i> Guardar Cambios
                    </button>
                    <a href="{% if tipo_caja == 'CAJA' %}{{ url_for('caja_pagos') }}{% else %}{{ url_for('caja_reembolsos_pagos') }}{% endif %}" class="btn btn-secondary">
                        <i class="fas fa-times"></i> Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>

    <script>
        function calcularTotalPago() {
            const base = parseFloat(document.getElementById('base').value) || 0;
            const iva = parseFloat(document.getElementById('iva').value) || 0;
            const total = base + iva;
            
            document.getElementById('total_pago').textContent = total.toFixed(2) + '€';
        }
        
        // Calcular total al cargar la página
        document.addEventListener('DOMContentLoaded', function() {
            calcularTotalPago();
        });
    </script>
</body>
</html>
