<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Orden de Carga {{ orden.numero_orden }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='orden_carga.css') }}">
</head>
<body class="oc-body">
<div class="toolbar no-print">
    <span>Impresión — Orden {{ orden.numero_orden }}</span>
    {% if tiene_adjunto %}
    <a href="{{ url_for('pdf_combinado_orden_carga', id=orden.id) }}" target="_blank" class="btn-secondary">Abrir PDF con adjunto</a>
    {% endif %}
    <button type="button" onclick="window.print()">Imprimir</button>
</div>

{% set lectura = true %}
{% set static_logo = url_for('static', filename='logo.png') %}
{% include '_orden_carga_sheet.html' %}

<script>window.addEventListener('load', function(){ setTimeout(function(){ window.print(); }, 500); });</script>
</body>
</html>
